[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-floor"
version = "0.2.0"
description = "A computable information-theoretic floor on the temporal sampling rate of world models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vrinda", email = "salujavrinda018@gmail.com" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["spectral_floor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
